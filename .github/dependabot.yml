# Weekly update proposals (pull requests, never automatic merges): Maven dependencies, Docker base images, and the
# commit-SHA pins of our GitHub Actions (lesson 19).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
