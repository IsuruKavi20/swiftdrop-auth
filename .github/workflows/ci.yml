# CI (lesson 19): every push and pull request is tested, built and scanned; main and version tags are published.
# Deploying stays a manual, human step (helm upgrade). Actions are pinned to commit SHAs (a moved tag can't inject code);
# Dependabot (.github/dependabot.yml) proposes updates to these pins.
name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:

# Nothing by default; each job asks only for what it needs
permissions: {}

# A newer push to the same branch cancels the outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: hyd.ocir.io/ax8lt6cfwnh8/swiftdrop/auth
  BACKUP_IMAGE: hyd.ocir.io/ax8lt6cfwnh8/swiftdrop/auth-backup

jobs:
  test:
    name: Tests (mvnw verify)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Unit + integration tests; Testcontainers starts Postgres, Redis and Mailpit with the runner's Docker
      - run: ./mvnw -B verify

  scan:
    name: Image build + Trivy scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: swiftdrop-auth:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Known, fixable HIGH/CRITICAL vulnerabilities fail the build: shipping them must be a visible decision
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: swiftdrop-auth:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      # The nightly backup job's image (deploy/backup): same rules
      - name: Build the backup image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/backup
          load: true
          tags: swiftdrop-backup:scan
      - name: Trivy scan (backup image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: swiftdrop-backup:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  publish:
    name: Publish to OCIR
    needs: [test, scan]
    # Only our own pushes to main or version tags: never pull requests (and so never forks)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image tags (commit id, plus the version for tags)
        id: tags
        run: |
          version=$(grep -m1 -oP '(?<=<version>)[^<]+(?=</version>)' <(sed -n '/<artifactId>auth<\/artifactId>/,$p' pom.xml))
          tags="${IMAGE}:${version}-${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "backup=${BACKUP_IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # ARM build for Oracle's free Ampere machines: only the small runtime stage is emulated (see Dockerfile)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: hyd.ocir.io
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/backup
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.backup }}
