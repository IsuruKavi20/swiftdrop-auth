# Local kind cluster (deploy/kind/cluster.yaml): https://auth.127.0.0.1.nip.io:8443
# nip.io: any name ending in 127.0.0.1.nip.io resolves to 127.0.0.1, so no hosts-file edits are needed.
image:
  repository: swiftdrop-auth
  tag: 1.1.0-local
  pullPolicy: Never        # loaded into the cluster with "kind load docker-image", never pulled

publicHost: auth.127.0.0.1.nip.io
publicPort: "8443"
frontends:
  - { id: local, baseUrl: http://localhost:5173, primary: true }
# kind's pod network: the Traefik pods live here
trustedProxies: '10\.244\.\d{1,3}\.\d{1,3}'

autoscaling:
  enabled: false           # kind has no metrics-server; fixed 2 copies

ingress:
  tls:
    internalCa: true

mailpit:
  enabled: true
