# Our own small certificate authority (cert-manager), so traffic INSIDE the cluster is encrypted too:
# app -> Postgres, app -> Redis, app -> Mailpit. The app trusts only this CA (lesson 17, option A).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "auth.name" . }}-selfsigned
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "auth.name" . }}-ca
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: SwiftDrop internal CA
  secretName: {{ include "auth.name" . }}-ca
  duration: 87600h        # 10 years: the root; the service certificates below renew automatically
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: {{ include "auth.name" . }}-selfsigned, kind: Issuer }
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "auth.name" . }}-ca
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ include "auth.name" . }}-ca
{{- range $component := list "postgres" "redis" "mailpit" }}
{{- if (index $.Values $component).enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "auth.name" $ }}-{{ $component }}
  labels: {{- include "auth.labels" $ | nindent 4 }}
spec:
  secretName: {{ include "auth.name" $ }}-{{ $component }}-tls
  duration: 2160h         # 90 days, renewed 30 days before the end
  renewBefore: 720h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  dnsNames: {{- include "auth.dnsNames" (list $ $component) | nindent 4 }}
  ipAddresses: ["127.0.0.1"]   # health checks inside the container connect to localhost
  issuerRef: { name: {{ include "auth.name" $ }}-ca, kind: Issuer }
{{- end }}
{{- end }}
{{- if .Values.ingress.tls.internalCa }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "auth.name" . }}-ingress
  labels: {{- include "auth.labels" . | nindent 4 }}
spec:
  secretName: {{ include "auth.name" . }}-ingress-tls
  dnsNames: [{{ .Values.publicHost | quote }}]
  issuerRef: { name: {{ include "auth.name" . }}-ca, kind: Issuer }
{{- end }}
