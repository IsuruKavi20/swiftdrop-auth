# Oracle OKE (lesson 17): helm upgrade --install auth deploy/helm/swiftdrop-auth -n swiftdrop -f deploy/helm/swiftdrop-auth/values-oracle.yaml
image:
  repository: hyd.ocir.io/ax8lt6cfwnh8/swiftdrop/auth
  tag: 1.1.0-22d8a53
  # The registry is private: the cluster logs in with this Secret (created with kubectl, never in git)
  pullSecrets: [{ name: ocir-pull }]

# Our domain (Namecheap, GitHub Student Pack): DNS A record auth -> 144.24.131.248 (the network load balancer).
# This one line sets the issuer in every token, the Google redirect URI, and the Let's Encrypt certificate name.
publicHost: auth.getswiftdrop.me
# The SwiftDrop app. `local` (teammates' laptops) stays only until the separate dev auth exists (STEP-FRONTENDS
# decision 3), then it is removed here. Primary = `web` since the app went online on 14 Nov (decision 2): email links
# (verify, reset, email change) open the live site. Laptops send frontend=local for Google login, so they still return.
# Memory: the pods were OOMKilled at 768Mi (14 Nov). Java takes 75% of the limit for the heap; the rest (classes,
# threads, buffers) needs ~300Mi more. 1280Mi gives that room; 2 pods still fit easily on the 2 nodes (~6 GB each).
resources:
  requests: { cpu: 250m, memory: 768Mi }
  limits: { memory: 1280Mi }

frontends:
  - { id: local, baseUrl: http://localhost:5173 }
  - { id: web, baseUrl: https://app.getswiftdrop.me, primary: true }
# OKE here uses VCN-native pod networking: Traefik's pods get addresses from the node subnet 10.0.10.0/24,
# so only those may set X-Forwarded-For (the network load balancer keeps the real client IP up to Traefik)
trustedProxies: '10\.0\.10\.\d{1,3}'

bootstrapAdminEmail: isurukpremasiri2001@gmail.com

# SwiftDrop's backend (AWS) reads people from the Directory API. Its secret is in AWS SSM
# (/swiftdrop/dev/identity/client-secret); only the hash is here, in the Secret swiftdrop-auth-directory.
directoryClients:
  - clientId: svc_swiftdrop-backend
    permissions: [directory:read, directory:read-email, events:read, erasure:confirm, token:introspect]

# SwiftDrop's backend gets identity events: pushed right away (signed SETs) + polling as the safety net.
eventReceivers:
  - id: swiftdrop-backend
    audience: swiftdrop-backend
    pushUrl: https://api.getswiftdrop.me/internal/identity-events

ingress:
  tls:
    internalCa: false
    clusterIssuer: letsencrypt

postgres:
  # Paravirtualized disks: required by our nodes' in-transit encryption (deploy/oke/storageclass.yaml)
  storageClass: oci-bv-encrypted
  storage: 50Gi           # Oracle's minimum block volume size (free within the 200 GB Always Free storage)

# Real email through Brevo (free plan). getswiftdrop.me is authenticated there (DKIM + DMARC DNS records), so
# Gmail etc. trust our mail. The SMTP login and key live in the Secret (mail-username / mail-password).
mail:
  host: smtp-relay.brevo.com
  port: 587
  from: no-reply@getswiftdrop.me
mailpit:
  enabled: false

# Nightly encrypted backup (plan/STEP-BACKUPS.md, lesson 28). Switched on after the Console setup (bucket, write-only
# user, its key in the Secret swiftdrop-auth-backup, db-backup-password in swiftdrop-auth-secrets, age public key).
backup:
  enabled: true
  image:
    repository: hyd.ocir.io/ax8lt6cfwnh8/swiftdrop/auth-backup
    tag: 76ccce2
  bucket: swiftdrop-auth-backups
  region: ap-hyderabad-1
  endpoint: https://ax8lt6cfwnh8.compat.objectstorage.ap-hyderabad-1.oraclecloud.com
  # Isuru's age PUBLIC key (can only lock; the private key is never in the cluster)
  ageRecipient: age15egrclv8a2p6k4yhtzc8yqz69e82kym5nch09wd9ansmk5n0d5cq5pmyk4
