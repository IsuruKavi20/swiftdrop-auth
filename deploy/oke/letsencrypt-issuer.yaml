# Let's Encrypt: free, browser-trusted certificates for the public address, issued and renewed automatically by
# cert-manager. It proves we own the domain by answering a challenge on http://<domain>/.well-known/acme-challenge/
# (served through Traefik). Replace the email (Let's Encrypt sends expiry warnings there), then:
#   kubectl apply -f deploy/oke/letsencrypt-issuer.yaml
# Try the "staging" issuer first if you are testing a lot: production has strict rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: CHANGE-ME@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: CHANGE-ME@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
