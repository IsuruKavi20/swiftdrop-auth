# Local Kubernetes for practising the deployment (lesson 17): 1 control plane + 2 worker nodes,
# so the 2 app copies can land on different "machines" like in the cloud.
# Create: kind create cluster --config deploy/kind/cluster.yaml    Delete: kind delete cluster --name swiftdrop
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: swiftdrop
nodes:
  - role: control-plane
    # The ingress controller runs here; ports 80/443 on your laptop lead into the cluster
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088
        listenAddress: "127.0.0.1"
      - containerPort: 443
        hostPort: 8443
        listenAddress: "127.0.0.1"
  - role: worker
  - role: worker
