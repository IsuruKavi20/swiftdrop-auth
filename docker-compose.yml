# Local development services for the auth service: Postgres, Redis, Mailpit.
# Start: docker compose up -d    Stop: docker compose down
services:
  postgres:
    image: postgres:17-alpine
    container_name: swiftdrop-auth-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - auth-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared rate limits + Google login session. Password required, reachable from this laptop only.
  # 6380 on the laptop: 6379 may already be used by another project.
  redis:
    image: redis:7.4-alpine
    container_name: swiftdrop-auth-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--protected-mode", "yes",
              "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Fake mail server for development: SMTP on 1025, inbox in the browser at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: swiftdrop-auth-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  auth-pgdata:
