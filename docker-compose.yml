# Local development database for the auth service.
# Start: docker compose up -d    Stop: docker compose down
services:
  postgres:
    image: postgres:17-alpine
    container_name: swiftdrop-auth-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - auth-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Fake mail server for development: SMTP on 1025, inbox in the browser at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: swiftdrop-auth-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  auth-pgdata:
