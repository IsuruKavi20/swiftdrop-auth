# Test-only Spring settings (not part of the application).
# Spring keeps every distinct test setup (application context, with its DB/Redis pools and threads) cached for
# reuse, 32 by default. On a 16 GB laptop running Docker and an IDE that ran out of memory (identity step 3b-3,
# JVM crash "insufficient memory"). Keep at most 6: rarely used setups are rebuilt when needed (a bit slower).
spring.test.context.cache.maxSize=6
