# Your laptop: secrets come from the git-ignored .env file.
spring:
  config:
    import: optional:file:.env[.properties]
  mail:
    host: localhost
    port: 1025

# Teammates' API contract: http://localhost:9000/swagger-ui.html and /v3/api-docs
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

swiftdrop:
  # Teammates: POST /api/v1/dev/test-tokens {"roles":["COURIER"]} for an instant dev token.
  # Exists ONLY with the dev profile; production refuses to start if this is ever true there.
  dev:
    test-tokens:
      enabled: true
  jwt:
    issuer: http://localhost:9000
    # Generated on first start, kept in the git-ignored .secrets/ folder
    private-key-location: .secrets/jwt-signing-key.pem
    create-key-if-missing: true
  # Email links point here. Configured, never taken from the request's Host header.
  # The registered frontends (email links, Google login, CORS): the team's React app (Vite) and any local app on 3000
  frontends:
    - {id: local, base-url: http://localhost:5173, primary: true}
    - {id: local-3000, base-url: http://localhost:3000}
  # Identity events to a SwiftDrop backend running on this laptop too (identity step 6). Leave push-url out for
  # poll-only. The backend polls with svc_swiftdrop-backend (events:read) from swiftdrop.directory.clients.
  # events:
  #   receivers:
  #     - id: swiftdrop-backend
  #       audience: swiftdrop-backend
  #       push-url: http://localhost:8080/internal/identity-events
