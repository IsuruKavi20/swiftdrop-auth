spring:
  application:
    name: auth
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
  flyway:
    user: ${DB_MIGRATOR_USER}
    password: ${DB_MIGRATOR_PASSWORD}
    schemas: identity
    default-schema: identity
    create-schemas: false

management:
  endpoints:
    web:
      exposure:
        include: health
