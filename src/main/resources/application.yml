spring:
  application:
    name: auth
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
  flyway:
    schemas: identity
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health
